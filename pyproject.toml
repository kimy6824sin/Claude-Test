[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshrev"
version = "0.1.0"
description = "Mesh-to-CAD reverse engineering workbench for piston engine parts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "vtk>=9.3",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "qtpy>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
cad = ["cadquery-ocp>=7.7"]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "ruff>=0.4"]

[project.gui-scripts]
meshrev = "meshrev.app:main"

[tool.setuptools.packages.find]
include = ["meshrev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "gui: needs a display (run under xvfb-run on headless machines)",
    "cad: needs the optional OpenCASCADE (OCP) kernel",
]
filterwarnings = ["ignore::DeprecationWarning:pyvista.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]
